services:
  - type: web
    name: vayntr-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FRONTEND_ORIGINS
        value: https://nappygorilla.github.io
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_REPLY_TO
        sync: false
      - key: STAFF_REVIEW_TOKEN
        sync: false
