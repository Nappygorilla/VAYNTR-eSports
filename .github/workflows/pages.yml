name: Deploy VAYNTR website to GitHub Pages

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate required static files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s recruitment.html
          test -s recruitment.js
          test -s server.js
          test -s staff-applications.html
          test -s staff.js
          test -s staff.css
          test -s roster.html
          test -s roster.js
          test -s content.js
          test -s about.html
          test -s partnerships.html
          test -s sitemap.xml
          test -s robots.txt
          test -s 404.html
          test -s assets/vayntr-mark.svg
          node --check app.js
          node --check server.js
          node --check recruitment.js
          node --check staff.js
          node --check roster.js
          node --check content.js
          grep -q 'name="viewport"' index.html
          grep -q 'prefers-reduced-motion' styles.css
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
