name: Deploy VAYNTR website to GitHub Pages

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate site and scripts
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s year.js
          test -s navigation.js
          test -s recruitment.html
          test -s staff-applications.html
          test -s sitemap.xml
          test -s robots.txt
          test -s 404.html
          test -s assets/vayntr-mark.svg
          node security-check.js
          node scripts/check-site.js
          for f in app.js year.js navigation.js recruitment.js partnerships.js auth.js staff.js roster.js content.js player.js server.js; do node --check "$f"; done
          grep -q 'name="viewport"' index.html
          grep -q 'prefers-reduced-motion' styles.css
      - name: Assemble public site (static files only)
        run: |
          rm -rf dist && mkdir -p dist/assets
          cp ./*.html dist/
          cp app.js year.js navigation.js recruitment.js partnerships.js auth.js staff.js roster.js content.js player.js dist/
          cp styles.css staff.css sitemap.xml robots.txt dist/
          cp assets/* dist/assets/
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
